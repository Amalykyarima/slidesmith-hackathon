<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </span>
    SlideSmith
  </a>

  @if (auth.signedIn()) {
    <nav aria-label="Main">
      <a routerLink="/styles" routerLinkActive="active"><span class="step">1</span>Styles</a>
      <a routerLink="/create" routerLinkActive="active"><span class="step">2</span>Create slides</a>
    </nav>
  } @else {
    <span class="spacer"></span>
  }

  @let h = health();
  @if (h === null) {
    <span class="pill pill-bad" title="Start the backend: uvicorn app.main:app --reload --port 8000">Backend offline</span>
  } @else if (h) {
    @if (h.ai_enabled) {
      <span class="pill pill-ok" [title]="'Model: ' + h.model">Claude connected</span>
    } @else {
      <span class="pill pill-warn" title="No ANTHROPIC_API_KEY set. Slides are built from your notes without AI rewriting.">Demo mode · no AI key</span>
    }
  }
  @if (auth.name(); as name) {
    <span class="who">
      <span class="small muted">{{ name }}</span>
      <button type="button" class="btn btn-sm" (click)="signOut()">Sign out</button>
    </span>
  }
</header>

<main class="page">
  <router-outlet />
</main>
