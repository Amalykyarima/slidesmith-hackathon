# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Free plan: sleeps after 15 min idle (about a minute to wake) and its disk is wiped on
# every sleep, restart or deploy. Set the two SUPABASE_ keys (docs/HOSTING.md) and work is
# saved to Supabase Storage and brought back on every start.
services:
  - type: web
    name: slidesmith-hackathon   # separate from the school's live app
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY      # from platform.claude.com; leave empty for demo mode
        sync: false
      - key: ACCESS_CODES           # e.g. "Mrs Khan:maple-42, Mr Lee:river-7"
        sync: false
      - key: SECRET_KEY             # signs the sign-in cookie
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: PREVIEW_MAX_SLIDES     # keeps LibreOffice under the 512 MB limit
        value: "12"
      - key: AI_DAILY_LIMIT         # AI generations per teacher per day
        value: "20"
      - key: SUPABASE_URL           # e.g. https://abcd1234.supabase.co (Project Settings > API)
        sync: false
      - key: SUPABASE_SERVICE_KEY   # the service_role / secret key: never put it in the frontend
        sync: false
      - key: SUPABASE_BUCKET        # a PRIVATE bucket you create in Supabase Storage
        value: slidesmith-hackathon # never the school's bucket
      - key: LIVEKIT_URL            # live avatar (hackathon pass page / cloud.livekit.io)
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AVATAR_SECRET          # same value as AVATAR_SECRET in avatar/.env
        sync: false
