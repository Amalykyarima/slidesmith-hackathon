<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Teachers' decks often use Gill Sans (a macOS/Office font Linux doesn't have).
       Preview it with Carlito, which has similar widths, so line breaks match PowerPoint. -->
  <alias binding="same"><family>Gill Sans</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Gill Sans MT</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
</fontconfig>
